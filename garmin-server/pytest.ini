[pytest]
# 🔴 FIX #40: Configuration pytest pour les tests unitaires
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents (>1s)

