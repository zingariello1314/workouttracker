name: Tests E2E - Garmin Tab

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/components/tabs/GarminTab/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/components/tabs/GarminTab/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
  workflow_dispatch: # Permet de déclencher manuellement

jobs:
  e2e-tests:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Matrice de tests : on peut ajouter d'autres navigateurs si nécessaire
        browser: [chromium]
        # On peut ajouter d'autres OS si nécessaire
        # os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start backend server
        run: |
          cd garmin-server
          node garmin-server.js &
          echo $! > ../server.pid
        env:
          NODE_ENV: test
          PORT: 3031

      - name: Wait for backend server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:3031/api/garmin/status; do sleep 1; done'
        continue-on-error: true

      - name: Run E2E tests (P0 - Critical)
        run: npx playwright test tests/e2e/garmin-p0-critical.spec.js --project=${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: http://localhost:3001
          BACKEND_URL: http://localhost:3031

      - name: Run E2E tests (P1 - Nominal)
        run: npx playwright test tests/e2e/garmin-p1-nominal.spec.js --project=${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: http://localhost:3001
          BACKEND_URL: http://localhost:3031

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: playwright-report/results.json
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 3

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 3

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  e2e-summary:
    name: Résumé des tests E2E
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## 📊 Résumé des tests E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les tests E2E ont été exécutés sur les navigateurs configurés." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts disponibles" >> $GITHUB_STEP_SUMMARY
          echo "- Rapports Playwright HTML" >> $GITHUB_STEP_SUMMARY
          echo "- Résultats JSON" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots (en cas d'échec)" >> $GITHUB_STEP_SUMMARY
          echo "- Vidéos (en cas d'échec)" >> $GITHUB_STEP_SUMMARY


